# Integración continua: compila y ejecuta los tests en cada PR hacia main y en cada push a main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Misma versión que los proyectos (net10.0)
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Solo tests unitarios: no requieren SQL Server
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
